[package]
name = "texturecraft-projectfiles"
description = "Import of .spp projects, .spsm materials, .spmsk masks and .sbsar archives"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
glam = { workspace = true }
hdf5-reader = { version = "0.9.1", default-features = false }
image = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jpeg2k = { version = "0.10.1", default-features = false, features = ["openjpeg-sys"] }
